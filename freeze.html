<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>木頭人對決</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--p1:#FF5C9A;--p2:#3DA9FC;--sun:#FFC93C;--ok:#2FBF71;--bad:#F25C3B;--ink:#1E2033;--card:rgba(255,255,255,.92)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{font-family:"Zen Maru Gothic","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#fff;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}
#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.shade{position:fixed;inset:0;background:rgba(10,12,30,.35);pointer-events:none;opacity:0;transition:opacity .3s}
.shade.on{opacity:1}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
.chip{background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:8px 18px;font-weight:900;font-size:1.3rem;white-space:nowrap}
.chip.p1{box-shadow:inset 0 0 0 3px var(--p1)} .chip.p2{box-shadow:inset 0 0 0 3px var(--p2)}
#center{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:90%}
#big{font-size:clamp(3rem,11vw,8rem);font-weight:900;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#sub{font-size:clamp(1.3rem,3.5vw,2.4rem);font-weight:900;margin-top:10px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.fig{position:fixed;top:50%;transform:translateY(-50%);width:clamp(120px,16vw,200px);background:var(--card);border-radius:24px;padding:10px 10px 6px;
  text-align:center;color:var(--ink);font-weight:900;display:none}
.fig svg{width:100%;height:auto;display:block}
.fig.on{display:block;animation:pop .3s ease-out}
#figL{left:calc(16px + env(safe-area-inset-left,0px));border:5px solid var(--p1)}
#figR{right:calc(16px + env(safe-area-inset-right,0px));border:5px solid var(--p2)}
.badge{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom,0px));padding:12px 22px;border-radius:20px;font-weight:900;font-size:clamp(1.3rem,3vw,2rem);display:none;text-align:center}
.badge.on{display:block;animation:pop .3s ease-out}
.badge.ok{background:var(--ok)} .badge.bad{background:var(--bad)}
#badgeL{left:12%} #badgeR{right:12%}
.bar{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(60vw,520px);height:14px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;display:none}
.bar i{display:block;height:100%;width:100%;background:var(--sun)}
#actions{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;gap:12px}
#actions.on{display:flex}
button{font:inherit;font-weight:900;font-size:1.3rem;border:0;border-radius:999px;padding:16px 28px;cursor:pointer;color:#fff;background:var(--p1);box-shadow:0 5px 0 #c73a73}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #c73a73}
button.ghost{background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);color:var(--ink);border-radius:28px;padding:26px 30px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.card h1{margin:0;font-size:2.6rem;line-height:1.1}
.card p{margin:0;line-height:1.6;color:#555}
.row{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.row b{min-width:5em;text-align:right}
.seg button{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px #ccd;font-size:1.05rem;padding:10px 16px}
.seg button.sel{background:var(--sun);box-shadow:inset 0 0 0 2px var(--sun)}
#status{font-weight:700;color:#777;min-height:1.4em}
#rotate{position:fixed;inset:0;background:#1E2033;display:none;align-items:center;justify-content:center;text-align:center;font-size:1.6rem;font-weight:900;padding:30px;z-index:9}
@media (orientation:portrait){#rotate{display:flex}}
@keyframes pop{0%{transform:translateY(-50%) scale(.6);opacity:0}100%{opacity:1}}
.badge.on{animation:none}
@media (prefers-reduced-motion:reduce){.fig.on{animation:none}}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="ov"></canvas>
<div class="shade" id="shade"></div>

<div id="hud" style="display:none">
  <div class="chip p1" id="s1">玩家 1：0</div>
  <div class="chip" id="roundchip">第 1 回</div>
  <div class="chip p2" id="s2">玩家 2：0</div>
</div>

<div id="center"><div id="big"></div><div id="sub"></div></div>
<div class="fig" id="figL"><div id="svgL"></div><div>玩家 1</div></div>
<div class="fig" id="figR"><div id="svgR"></div><div>玩家 2</div></div>
<div class="badge" id="badgeL"></div>
<div class="badge" id="badgeR"></div>
<div class="bar" id="bar"><i id="barfill"></i></div>
<div id="actions"><button class="ghost" id="btn-quit">結束</button><button id="btn-next">下一回合</button></div>

<div id="panel">
  <div class="card" id="card-start">
    <h1>🗿 木頭人對決</h1>
    <p>音樂停了，畫面會出現小人示範動作。3 秒內擺好姿勢並定格，動作不對或還在動就失敗！</p>
    <div class="row"><b>玩家</b><span class="seg" id="seg-players"><button data-v="1">1 人</button> <button data-v="2" class="sel">2 人</button></span></div>
    <div class="row"><b>回合</b><span class="seg" id="seg-rounds"><button data-v="5">5 回</button> <button data-v="10" class="sel">10 回</button> <button data-v="15">15 回</button></span></div>
    <div class="row"><b>判定</b><span class="seg" id="seg-strict"><button data-v="0">寬鬆</button> <button data-v="1" class="sel">普通</button> <button data-v="2">嚴格</button></span></div>
    <p>iPad 橫放立好，站遠一點讓<strong>全身</strong>入鏡。2 人時玩家 1 站左邊、玩家 2 站右邊。</p>
    <div id="status"></div>
    <div class="row"><button id="btn-start">開啟鏡頭，開始！</button></div>
  </div>
  <div class="card" id="card-end" style="display:none">
    <h1 id="end-title"></h1>
    <p id="end-text" style="font-size:1.4rem;color:var(--ink);font-weight:900"></p>
    <div class="row"><button id="btn-again">再玩一次</button></div>
  </div>
</div>
<div id="rotate">📱↻<br>請把 iPad 橫放</div>

<script type="module">
import {PoseLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);

/* ---- music: pre-rendered WAV loops played through <audio> (works on iPhone) ---- */
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
const SR=22050, BPM=128, STEP=60/BPM/2;
const TUNES=[
 {mel:["C5 - E5 - G5 - E5 - C5 - E5 - G5 - - -","A5 - G5 - F5 - E5 - D5 - E5 - F5 - - -","E5 - G5 - C6 - G5 - E5 - G5 - C6 - - -","D5 - D5 - E5 - F5 - G5 - F5 - E5 - D5 -"],bass:["C3","F3","C3","G3"]},
 {mel:["G4 G4 - B4 D5 - B4 - G4 G4 - B4 D5 - - -","E5 - D5 - C5 - B4 - A4 - B4 - C5 - - -","G4 G4 - B4 D5 - G5 - F#5 - E5 - D5 - - -","C5 - B4 - A4 - F#4 - G4 - - - G4 - - -"],bass:["G2","C3","G2","D3"]}
];
function hz(n){const m=n.match(/^([A-G])(#?)(\d)$/);const st={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(12*(+m[3]+1)+st-69)/12)}
function tone(buf,t0,dur,f,kind,vol){const s0=Math.floor(t0*SR),n=Math.floor(dur*SR);let ph=0;
  for(let i=0;i<n&&s0+i<buf.length;i++){ph+=f/SR;const x=ph%1;
    let w=kind==='sq'?(x<.5?1:-1):kind==='tri'?(4*Math.abs(x-.5)-1):Math.sin(2*Math.PI*x);
    const env=Math.min(1,i/(SR*.005))*Math.pow(1-i/n,1.5);buf[s0+i]+=w*vol*env}}
function kick(buf,t0){const s0=Math.floor(t0*SR),n=Math.floor(.18*SR);let ph=0;
  for(let i=0;i<n;i++){const f=40+110*Math.exp(-i/(SR*.03));ph+=f/SR;buf[s0+i]+=Math.sin(2*Math.PI*ph)*.55*(1-i/n)}}
function noise(buf,t0,dur,vol){const s0=Math.floor(t0*SR),n=Math.floor(dur*SR);
  for(let i=0;i<n&&s0+i<buf.length;i++)buf[s0+i]+=(Math.random()*2-1)*vol*Math.pow(1-i/n,2)}
function render(tune){const steps=64,len=Math.ceil(steps*STEP*SR),buf=new Float32Array(len);
  for(let st=0;st<steps;st++){const t=st*STEP,bar=Math.floor(st/16),s=st%16;
    if(s%4===0)kick(buf,t); if(s%8===4)noise(buf,t,.14,.25); noise(buf,t,.04,.06);
    if(s%2===0)tone(buf,t,STEP*1.7,hz(tune.bass[bar]),'tri',.28);
    const tok=tune.mel[bar].split(' ')[s]; if(tok&&tok!=='-')tone(buf,t,STEP*.95,hz(tok),'sq',.09)}
  // encode 16-bit mono WAV
  const dv=new DataView(new ArrayBuffer(44+len*2));const w=(o,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF');dv.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){const v=Math.max(-1,Math.min(1,buf[i]*.9));dv.setInt16(44+i*2,v*32767,true)}
  return URL.createObjectURL(new Blob([dv],{type:'audio/wav'}))}
const TRACKS=TUNES.map(render);
const player=new Audio();player.loop=true;player.preload='auto';player.src=TRACKS[0];
let track=0;
function musicStart(fresh){if(fresh){track=Math.floor(Math.random()*TRACKS.length);player.src=TRACKS[track];player.currentTime=0}
  const p=player.play();if(p&&p.catch)p.catch(()=>{msg('點一下畫面','讓音樂開始播放')})}
function musicStop(){player.pause()}
let ctx=null;
function unlock(){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}}
function ding(f,d,w=0){try{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+w;
  o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d)}catch(e){}}
function say(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}



/* ---------- poses ---------- */
const D={head:[50,18],ls:[38,34],rs:[62,34],lh:[43,75],rh:[57,75],lk:[42,100],la:[41,126],rk:[58,100],ra:[59,126],le:[30,54],lw:[28,72],re:[70,54],rw:[72,72]};
const P=(o)=>Object.assign({},D,o);
const L={nose:0,ls:11,rs:12,le:13,re:14,lw:15,rw:16,lh:23,rh:24,lk:25,rk:26,la:27,ra:28};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const above=(w,k)=>w.y<k.nose.y;
const nearHip=(w,h,k)=>dist(w,h)<0.5*k.T;
const armOut=(w,s,k)=>Math.abs(w.y-s.y)<0.45*k.T&&Math.abs(w.x-s.x)>0.7*k.T;
const POSES=[
 {name:"雙手舉高",need:["lw","rw"],fig:P({le:[34,18],lw:[32,2],re:[66,18],rw:[68,2]}),
  ok:k=>above(k.lw,k)&&above(k.rw,k)},
 {name:"飛機（雙手打開）",need:["lw","rw"],fig:P({le:[22,34],lw:[6,34],re:[78,34],rw:[94,34]}),
  ok:k=>armOut(k.lw,k.ls,k)&&armOut(k.rw,k.rs,k)},
 {name:"雙手叉腰",need:["lw","rw","lh","rh"],fig:P({le:[24,52],lw:[40,72],re:[76,52],rw:[60,72]}),
  ok:k=>nearHip(k.lw,k.lh,k)&&nearHip(k.rw,k.rh,k)},
 {name:"金雞獨立",need:["lk","rk"],fig:P({le:[26,44],lw:[14,52],re:[74,44],rw:[86,52],lk:[42,100],la:[42,126],rk:[66,80],ra:[62,102]}),
  ok:k=>Math.abs(k.lk.y-k.rk.y)>0.3*k.T||Math.abs(k.la.y-k.ra.y)>0.4*k.T},
 {name:"蹲下",need:["lk","rk","lh","rh"],fig:P({head:[50,46],ls:[38,62],rs:[62,62],lh:[42,98],rh:[58,98],lk:[28,102],la:[32,126],rk:[72,102],ra:[68,126],le:[28,74],lw:[20,84],re:[72,74],rw:[80,84]}),
  ok:k=>((k.lk.y-k.lh.y)+(k.rk.y-k.rh.y))/2<0.45*k.T},
 {name:"單手舉高",need:["lw","rw"],fig:P({le:[34,18],lw:[32,2]}),
  ok:k=>(above(k.lw,k)&&k.rw.y>k.rs.y)||(above(k.rw,k)&&k.lw.y>k.ls.y)},
 {name:"雙手摸頭",need:["lw","rw"],fig:P({le:[22,22],lw:[40,8],re:[78,22],rw:[60,8]}),
  ok:k=>[k.lw,k.rw].every(w=>w.y<k.ls.y&&dist(w,k.nose)<0.75*k.T)},
 {name:"大字形",need:["lw","rw","la","ra"],fig:P({le:[26,22],lw:[12,8],re:[74,22],rw:[88,8],lk:[34,100],la:[22,126],rk:[66,100],ra:[78,126]}),
  ok:k=>k.lw.y<k.ls.y&&k.rw.y<k.rs.y&&Math.abs(k.la.x-k.ra.x)>1.2*dist(k.ls,k.rs)},
 {name:"一手舉高一手叉腰",need:["lw","rw","lh","rh"],fig:P({le:[34,18],lw:[32,2],re:[76,52],rw:[60,72]}),
  ok:k=>(above(k.lw,k)&&nearHip(k.rw,k.rh,k))||(above(k.rw,k)&&nearHip(k.lw,k.lh,k))},
];
function figSVG(f,color){const l=(a,b)=>`<line x1="${f[a][0]}" y1="${f[a][1]}" x2="${f[b][0]}" y2="${f[b][1]}"/>`;
  const nx=(f.ls[0]+f.rs[0])/2,ny=f.ls[1]-2,hx=(f.lh[0]+f.rh[0])/2,hy=f.lh[1];
  return `<svg viewBox="0 -4 100 136"><g stroke="${color}" stroke-width="6" stroke-linecap="round" fill="none">
  <line x1="${nx}" y1="${ny}" x2="${hx}" y2="${hy}"/>${l('ls','rs')}${l('lh','rh')}${l('ls','le')}${l('le','lw')}${l('rs','re')}${l('re','rw')}
  ${l('lh','lk')}${l('lk','la')}${l('rh','rk')}${l('rk','ra')}</g><circle cx="${f.head[0]}" cy="${f.head[1]}" r="11" fill="${color}"/></svg>`}

/* ---------- settings ---------- */
let players=2, rounds=10, strict=1;
function seg(id,set){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{set(+b.dataset.v);
  document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('sel',x===b))})}
seg('seg-players',v=>players=v);seg('seg-rounds',v=>rounds=v);seg('seg-strict',v=>strict=v);
const MOVE=[0.28,0.18,0.11], HOLD=[0.5,0.65,0.8];

/* ---------- camera + model ---------- */
const video=$('v'), ov=$('ov'), g=ov.getContext('2d');
let landmarker=null, latest=[], lastT=-1;
async function setup(){
  $('status').textContent='開啟鏡頭中…';
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play().catch(()=>{});
  $('status').textContent='載入動作辨識中（第一次約 10 秒）…';
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:d},
    runningMode:"VIDEO",numPoses:2,minPoseDetectionConfidence:.5,minTrackingConfidence:.5});
  try{landmarker=await PoseLandmarker.createFromOptions(fs,opts("GPU"))}catch(e){landmarker=await PoseLandmarker.createFromOptions(fs,opts("CPU"))}
  requestAnimationFrame(loop);
}
function fit(){ov.width=innerWidth*devicePixelRatio;ov.height=innerHeight*devicePixelRatio}
addEventListener('resize',fit);fit();
function toScreen(p){const vw=video.videoWidth,vh=video.videoHeight,sw=innerWidth,sh=innerHeight,sc=Math.max(sw/vw,sh/vh);
  return {x:((sw-vw*sc)/2+(1-p.x)*vw*sc)*devicePixelRatio,y:((sh-vh*sc)/2+p.y*vh*sc)*devicePixelRatio}}
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function loop(){
  if(video.readyState>=2&&video.currentTime!==lastT){lastT=video.currentTime;
    try{const r=landmarker.detectForVideo(video,performance.now());latest=assign(r.landmarks||[])}catch(e){}
    draw();onFrame()}
  requestAnimationFrame(loop)}
function assign(list){ // -> [p1,p2] by on-screen side (mirrored)
  const withX=list.map(lm=>({lm,sx:1-(lm[23].x+lm[24].x)/2}));
  if(players===1){if(!withX.length)return [null];
    const big=withX.sort((a,b)=>torso(b.lm)-torso(a.lm))[0];return [big.lm]}
  withX.sort((a,b)=>a.sx-b.sx);
  if(withX.length>=2)return [withX[0].lm,withX[1].lm];
  if(withX.length===1)return withX[0].sx<0.5?[withX[0].lm,null]:[null,withX[0].lm];
  return [null,null]}
function torso(lm){return Math.hypot((lm[11].x+lm[12].x)/2-(lm[23].x+lm[24].x)/2,(lm[11].y+lm[12].y)/2-(lm[23].y+lm[24].y)/2)}
function draw(){g.clearRect(0,0,ov.width,ov.height);g.lineWidth=7*devicePixelRatio;g.lineCap='round';
  latest.forEach((lm,i)=>{if(!lm)return;g.strokeStyle=i===0?'#FF5C9A':'#3DA9FC';g.fillStyle=g.strokeStyle;
    BONES.forEach(([a,b])=>{if(lm[a].visibility<.4||lm[b].visibility<.4)return;const A=toScreen(lm[a]),B=toScreen(lm[b]);g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke()});
    if(lm[0].visibility>.4){const h=toScreen(lm[0]);g.beginPath();g.arc(h.x,h.y,12*devicePixelRatio,0,7);g.fill()}})}
function keypts(lm){const vw=video.videoWidth,vh=video.videoHeight,k={};
  for(const n in L){const p=lm[L[n]];k[n]={x:p.x*vw,y:p.y*vh,v:p.visibility}}
  const ms={x:(k.ls.x+k.rs.x)/2,y:(k.ls.y+k.rs.y)/2},mh={x:(k.lh.x+k.rh.x)/2,y:(k.lh.y+k.rh.y)/2};k.T=dist(ms,mh)||1;return k}

/* ---------- game ---------- */
let round=0, scores=[0,0], phase='idle', timers=[], pose=null, judge=null;
const later=(f,ms)=>timers.push(setTimeout(f,ms));
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function msg(b,s=''){$('big').textContent=b;$('sub').textContent=s}
function hud(){$('s1').textContent=`玩家 1：${scores[0]}`;$('s2').textContent=`玩家 2：${scores[1]}`;$('s2').style.display=players===2?'block':'none';
  $('roundchip').textContent=`第 ${round} 回 / ${rounds}`}
function reset(){['figL','figR','badgeL','badgeR'].forEach(i=>$(i).classList.remove('on'));$('bar').style.display='none';$('actions').classList.remove('on');$('shade').classList.remove('on')}
function dance(){reset();round++;hud();phase='dance';msg('跳舞！💃','音樂停就要擺出小人的動作');unlock();musicStart(true);
  later(()=>{if(phase==='dance')msg('','')},2500);later(freeze,4000+Math.random()*8000)}
function freeze(){phase='count';musicStop();pose=POSES[Math.floor(Math.random()*POSES.length)];
  $('shade').classList.add('on');
  $('svgL').innerHTML=figSVG(pose.fig,'#FF5C9A');$('figL').classList.add('on');
  if(players===2){$('svgR').innerHTML=figSVG(pose.fig,'#3DA9FC');$('figR').classList.add('on')}
  say('木頭人！'+pose.name.replace(/（.*）/,''));if(navigator.vibrate)navigator.vibrate(200);
  [3,2,1].forEach((n,i)=>later(()=>{msg(String(n),pose.name);ding(660,.12)},i*1000));
  later(startJudge,3000)}
function startJudge(){phase='judge';msg('定格！','不要動…');ding(988,.25);
  judge={frames:Array.from({length:players},()=>[]),start:performance.now()};
  $('bar').style.display='block';
  const tick=setInterval(()=>{const f=Math.max(0,1-(performance.now()-judge.start)/1500);$('barfill').style.width=f*100+'%';if(f<=0)clearInterval(tick)},50);
  later(finishJudge,1500)}
function onFrame(){if(phase!=='judge')return;for(let i=0;i<players;i++)judge.frames[i].push(latest[i]?keypts(latest[i]):null)}
function evaluate(fr){const seen=fr.filter(Boolean);
  if(seen.length<fr.length*0.5||!seen.length)return {ok:false,why:'沒入鏡'};
  const vis=seen.filter(k=>pose.need.every(n=>k[n].v>.5));
  if(vis.length<seen.length*0.5)return {ok:false,why:'沒拍到全身'};
  const good=vis.filter(k=>{try{return pose.ok(k)}catch(e){return false}}).length/vis.length;
  const pts=['nose','ls','rs','lw','rw','lh','rh','lk','rk'],base=seen[0];let maxMove=0;
  seen.forEach(k=>{let s=0;pts.forEach(n=>s+=dist(k[n],base[n]));maxMove=Math.max(maxMove,s/pts.length/base.T)});
  if(good<HOLD[strict])return {ok:false,why:'動作不對'};
  if(maxMove>MOVE[strict])return {ok:false,why:'還在動'};
  return {ok:true,why:'過關！'}}
function finishJudge(){phase='result';$('bar').style.display='none';
  const res=judge.frames.map(evaluate);let anyOk=false;
  res.forEach((r,i)=>{const b=$(i?'badgeR':'badgeL');b.textContent=(r.ok?'✅ ':'❌ ')+(players===2?`玩家${i+1} `:'')+r.why;
    b.className='badge on '+(r.ok?'ok':'bad');if(r.ok){scores[i]++;anyOk=true}});
  if(players===1)$('badgeL').style.left='50%',$('badgeL').style.transform='translateX(-50%)';
  hud();msg(anyOk?'🎉':'😆','');if(anyOk){ding(784,.12);ding(1046,.2,.12)}else ding(300,.4);
  if(round>=rounds){later(end,2500)}else{$('btn-next').textContent='下一回合';$('actions').classList.add('on')}}
function end(){reset();phase='idle';msg('','');$('hud').style.display='none';$('panel').style.display='flex';$('card-start').style.display='none';$('card-end').style.display='flex';
  if(players===1){$('end-title').textContent=scores[0]>=rounds*0.7?'🏆 木頭人高手！':'👏 玩完囉！';$('end-text').textContent=`過關 ${scores[0]} / ${rounds} 回`}
  else{const [a,b]=scores;$('end-title').textContent=a===b?'🤝 平手！':`🏆 玩家 ${a>b?1:2} 獲勝！`;$('end-text').textContent=`玩家 1：${a} 分　玩家 2：${b} 分`}}
function begin(){scores=[0,0];round=0;$('panel').style.display='none';$('hud').style.display='flex';$('badgeL').style.left='';$('badgeL').style.transform='';dance()}

$('btn-start').onclick=async()=>{unlock();$('btn-start').disabled=true;
  try{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el)}catch(e){}
  try{if(!landmarker)await setup();$('status').textContent='';begin()}
  catch(e){$('status').textContent='鏡頭或動作辨識開不起來：請確認已允許相機，並用 Safari 開啟有 https 的網址。';}
  $('btn-start').disabled=false};
document.addEventListener('click',e=>{if(phase==='dance'&&player.paused&&e.target.tagName!=='BUTTON')musicStart(false)});
$('btn-next').onclick=()=>{clearTimers();dance()};
$('btn-quit').onclick=()=>{clearTimers();musicStop();end()};
$('btn-again').onclick=()=>{$('card-end').style.display='none';$('card-start').style.display='flex';begin()};
</script>
</body>
