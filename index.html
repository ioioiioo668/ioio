<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小星星樂園">
<meta name="theme-color" content="#E6F4FF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>小星星樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen app — top bar (home · title · stars→sticker book), stage below; home is a 2×2 grid of crayon tiles plus a sticker-book bar. Deliberate single bright theme for kids. */
:root{
  --ground:#E6F4FF; --card:#FFFFFF; --ink:#1E2B4A; --soft:#5B6B8C; --line:#C7DCF2;
  --tomato:#FF6A4D; --sun:#FFC23A; --leaf:#34B977; --berry:#7B5CFF; --guide:#DCE8F5; --cream:#FFF5D6;
  --display:"Fredoka","PingFang TC","Heiti TC","Noto Sans TC",system-ui,sans-serif;
  --body:"PingFang TC","Heiti TC","Noto Sans TC","Fredoka",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px}
header h1{flex:1;margin:0;font-family:var(--display);font-size:clamp(20px,5vw,30px);font-weight:700;text-wrap:balance}
.iconbtn{border:0;background:var(--card);color:var(--ink);width:52px;height:52px;border-radius:16px;font-size:26px;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);cursor:pointer}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.stars{border:0;color:var(--ink);font-family:var(--display);font-weight:700;font-size:22px;background:var(--card);padding:10px 16px;border-radius:999px;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums;cursor:pointer}
.stars.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
#stage{flex:1;min-height:0;overflow:auto;padding-inline:16px;padding-block:4px 16px;display:flex;flex-direction:column}
button{font-family:var(--body)}
button:focus-visible,select:focus-visible{outline:4px solid var(--berry);outline-offset:3px}

/* home */
.homewrap{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center}
.home{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{border:0;border-radius:28px;color:#fff;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;cursor:pointer;box-shadow:0 6px 0 rgba(30,43,74,.18)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,43,74,.18)}
.tile svg{width:clamp(56px,14vw,96px);height:auto}
.tile b{font-size:clamp(22px,5.5vw,34px);font-weight:800}
.tile small{font-family:var(--display);font-size:clamp(14px,3.4vw,18px);font-weight:600;opacity:.9;letter-spacing:.04em}
.t1{background:var(--tomato)} .t2{background:var(--berry)} .t3{background:var(--leaf)} .t4{background:#F0A400}
.bookbar{border:0;border-radius:24px;background:var(--card);box-shadow:0 5px 0 var(--line);padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;color:var(--ink);text-align:left}
.bookbar .bk{font-size:44px}
.bookbar b{font-size:22px;display:block}
.bookbar .sub{font-size:15px;color:var(--soft)}
.bookbar .mini{margin-left:auto;font-size:28px;letter-spacing:2px;white-space:nowrap;overflow:hidden;max-width:40%}
.parentlink{align-self:center;border:0;background:none;color:var(--soft);font-size:15px;padding:8px 12px;cursor:pointer;text-decoration:underline}

/* shared game bits */
.wrap{max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;flex:1}
.chip{align-self:center;background:var(--card);border-radius:999px;padding:6px 16px;font-size:18px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.prompt{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(22px,5.5vw,34px);font-weight:800;text-align:center}
.prompt .en{font-family:var(--display);color:var(--berry)}
.say{border:0;background:var(--sun);color:var(--ink);width:60px;height:60px;border-radius:50%;font-size:28px;cursor:pointer;box-shadow:0 4px 0 #D99A10;flex:none}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 #D99A10}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;align-content:center}
.pic{border:0;background:var(--card);border-radius:24px;aspect-ratio:1;max-width:100%;font-size:clamp(52px,15vw,130px);cursor:pointer;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;color:var(--ink)}
.pic.zycard{font-family:var(--body);font-weight:700}
.pic.ok{background:#DDF7E9;box-shadow:0 5px 0 var(--leaf)}
.pic.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--card);border-radius:28px;box-shadow:0 5px 0 var(--line);padding:20px}
.big .emo{font-size:clamp(90px,26vw,190px);line-height:1.1}
.big .word{font-family:var(--display);font-weight:700;font-size:clamp(48px,13vw,96px);letter-spacing:.04em}
.big .zybig{font-family:var(--body);font-weight:700;font-size:clamp(110px,30vw,220px);line-height:1.1}
.big .zh{font-size:22px;color:var(--soft)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:20px;padding:16px 22px;font-size:22px;font-weight:800;cursor:pointer;color:#fff;background:var(--berry);box-shadow:0 4px 0 #5A3FD6;min-width:110px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5A3FD6}
.btn.green{background:var(--leaf);box-shadow:0 4px 0 #24905B}
.btn.red{background:var(--tomato);box-shadow:0 4px 0 #D24A31}
.btn.plain{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.small{font-size:17px;padding:10px 14px;min-width:0;border-radius:14px}
.btn.rec{animation:pulse 1s infinite}
.btn[disabled]{opacity:.45;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.06)}}
.status{min-height:28px;text-align:center;font-size:20px;color:var(--soft)}

/* trace */
.trace-box{position:relative;align-self:center;background:var(--card);border-radius:28px;box-shadow:0 5px 0 var(--line);touch-action:none}
.trace-box canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:28px}
.zyhint{font-family:var(--body);color:var(--ink)}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--leaf)}
.steps i.cur{background:var(--sun)}

/* math */
.objs{background:var(--card);border-radius:28px;box-shadow:0 5px 0 var(--line);padding:18px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;min-height:150px;flex:1}
.objs span{font-size:clamp(38px,9vw,64px);line-height:1.15}
.eq{font-family:var(--display);font-weight:700;font-size:clamp(72px,20vw,150px);display:flex;align-items:center;justify-content:center;gap:.25em;font-variant-numeric:tabular-nums;line-height:1}
.eq i{font-style:normal;color:var(--berry)}
.eq b{color:var(--tomato)}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.num{border:0;background:var(--card);border-radius:24px;padding:14px 0;font-family:var(--display);font-weight:700;font-size:clamp(44px,11vw,72px);color:var(--ink);box-shadow:0 5px 0 var(--line);cursor:pointer}
.num.ok{background:#DDF7E9;box-shadow:0 5px 0 var(--leaf)}
.num.no{animation:shake .4s}

/* sticker book */
.bookhead{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.bookhead b{font-size:24px}
.meter{height:16px;background:var(--card);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);max-width:420px;width:100%}
.meter i{display:block;height:100%;width:0;background:var(--sun);border-radius:99px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.stk{aspect-ratio:1;max-width:100%;background:var(--card);border-radius:20px;display:grid;place-items:center;font-size:clamp(40px,10vw,60px);box-shadow:0 4px 0 var(--line)}
.stk.lock{background:#EEF4FB;color:var(--line);font-family:var(--display);font-size:34px;font-weight:700;box-shadow:none;border:3px dashed var(--line)}
#pop{position:fixed;inset:0;background:rgba(30,43,74,.45);display:grid;place-items:center;z-index:20;padding:16px}
#pop .card{background:var(--card);border-radius:32px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:360px;width:100%}
#pop .sticker{font-size:130px;line-height:1;animation:spin .9s ease-out}
#pop b{font-size:28px}
@keyframes spin{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1)}}

/* parent settings */
.set{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sec{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--line)}
.sec h2{margin:0;font-size:20px}
.sec p{margin:0;font-size:15px;color:var(--soft);line-height:1.6}
.vrow{display:flex;align-items:center;gap:10px;font-size:16px;flex-wrap:wrap}
.vrow > span{flex:none;width:5em}
.vrow select{flex:1;min-width:0;font-size:16px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.opt{display:flex;align-items:center;gap:10px;font-size:17px;padding:6px 0}
.opt input{width:22px;height:22px}
.tlog{font-size:15px;line-height:1.6;user-select:text;-webkit-user-select:text}
.recgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rc{border:2px solid var(--line);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.rc.has{border-color:var(--leaf);background:#F0FBF5}
.recgrp{border-top:2px solid var(--ground);padding-top:8px;display:flex;flex-direction:column;gap:10px}
.recgrp summary{display:flex;justify-content:space-between;align-items:center;font-size:17px;cursor:pointer;padding:6px 2px}
.recgrp summary span{color:var(--soft);font-variant-numeric:tabular-nums}
.recgrp > .btn{align-self:flex-start}
.rc .lbl{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.rc .sym{font-size:34px;font-weight:700;min-width:1.2em;flex:1;text-align:center}
.rc button{border:0;border-radius:12px;width:40px;height:40px;font-size:18px;background:var(--ground);color:var(--ink);cursor:pointer}
.rc button.on{background:var(--tomato);color:#fff;animation:pulse 1s infinite}
.rc button[disabled]{opacity:.3}
.credit{font-size:13px;color:var(--soft);text-align:center;line-height:1.6}
.credit a{color:var(--soft)}

/* cheer */
#cheer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9}
#cheer b{font-size:clamp(70px,20vw,150px);font-weight:900;color:var(--sun);-webkit-text-stroke:4px var(--ink);paint-order:stroke;opacity:0;transform:scale(.4)}
#cheer b.go{animation:pop 1s ease-out}
@keyframes pop{20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
@media (max-width:420px){.btn{font-size:19px;padding:14px 16px;min-width:0}.cards{gap:10px}.bookbar .mini{display:none}}
</style>

<div id="app">
  <header>
    <button class="iconbtn" id="homeBtn" aria-label="回首頁">⌂</button>
    <h1 id="title">小星星樂園</h1>
    <button class="stars" id="starBtn" aria-label="星星與貼紙本">⭐ <span id="starN">0</span></button>
  </header>
  <main id="stage"></main>
</div>
<div id="cheer"><b id="cheerTxt">棒！</b></div>
<div id="pop" hidden></div>

<script>
/* ============ 小工具 ============ */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; };
const escH = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const capped = (p, ms=3000) => Promise.race([p, sleep(ms)]);   // 換題不能卡在語音上
const lsGet = (k, d) => { try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

/* ============ 資料 ============ */
const THEMES = [
  {name:'動物', icon:'🐾', words:[['cat','貓咪','🐱'],['dog','狗狗','🐶'],['fish','魚','🐟'],['bird','小鳥','🐦'],['duck','鴨子','🦆'],['pig','豬','🐷'],['cow','牛','🐮'],['horse','馬','🐴'],['lion','獅子','🦁'],['tiger','老虎','🐯'],['monkey','猴子','🐵'],['rabbit','兔子','🐰'],['frog','青蛙','🐸'],['bear','熊','🐻'],['elephant','大象','🐘']]},
  {name:'水果', icon:'🍎', words:[['apple','蘋果','🍎'],['banana','香蕉','🍌'],['grapes','葡萄','🍇'],['orange','橘子','🍊'],['lemon','檸檬','🍋'],['peach','桃子','🍑'],['cherry','櫻桃','🍒'],['strawberry','草莓','🍓'],['watermelon','西瓜','🍉'],['pear','梨子','🍐']]},
  {name:'食物', icon:'🍰', words:[['egg','蛋','🥚'],['cake','蛋糕','🎂'],['milk','牛奶','🥛'],['bread','麵包','🍞'],['rice','飯','🍚'],['cookie','餅乾','🍪'],['pizza','披薩','🍕'],['ice cream','冰淇淋','🍦'],['candy','糖果','🍬'],['juice','果汁','🧃']]},
  {name:'交通', icon:'🚗', words:[['car','汽車','🚗'],['bus','公車','🚌'],['bike','腳踏車','🚲'],['train','火車','🚆'],['boat','船','⛵'],['plane','飛機','✈️'],['truck','卡車','🚚'],['taxi','計程車','🚕']]},
  {name:'顏色', icon:'🎨', words:[['red','紅色','🔴'],['blue','藍色','🔵'],['green','綠色','🟢'],['yellow','黃色','🟡'],['purple','紫色','🟣'],['black','黑色','⚫'],['white','白色','⚪'],['brown','咖啡色','🟤']]},
  {name:'身體', icon:'🙂', words:[['eye','眼睛','👁️'],['ear','耳朵','👂'],['nose','鼻子','👃'],['mouth','嘴巴','👄'],['hand','手','✋'],['foot','腳','🦶']]},
  {name:'大自然', icon:'🌳', words:[['sun','太陽','☀️'],['moon','月亮','🌙'],['star','星星','⭐'],['tree','樹','🌳'],['flower','花','🌸'],['rain','下雨','🌧️']]}
].map(t=>({...t, words:t.words.map(([en,zh,e])=>({en,zh,e,theme:t.name}))}));
const EN_NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const HINT = {A:'apple',B:'ball',C:'cat',D:'dog',E:'egg',F:'fish',G:'grapes',H:'horse',I:'ice cream',J:'juice',K:'kite',L:'lion',M:'milk',N:'nose',O:'orange',P:'pig',Q:'queen',R:'rabbit',S:'sun',T:'tree',U:'umbrella',V:'van',W:'water',X:'fox',Y:'yellow',Z:'zoo'};
// 注音：同音字（讓語音唸對）、例詞、圖
const ZY = {
  'ㄅ':['玻','爸爸','👨'],'ㄆ':['坡','葡萄','🍇'],'ㄇ':['摸','媽媽','👩'],'ㄈ':['佛','飛機','✈️'],
  'ㄉ':['得','弟弟','👦'],'ㄊ':['特','兔子','🐰'],'ㄋ':['呢','牛奶','🥛'],'ㄌ':['勒','老虎','🐯'],
  'ㄍ':['哥','哥哥','👦'],'ㄎ':['科','蝌蚪','🐸'],'ㄏ':['喝','花','🌸'],
  'ㄐ':['機','雞','🐔'],'ㄑ':['欺','氣球','🎈'],'ㄒ':['希','西瓜','🍉'],
  'ㄓ':['知','蜘蛛','🕷️'],'ㄔ':['吃','車子','🚗'],'ㄕ':['詩','獅子','🦁'],'ㄖ':['日','日出','🌅'],
  'ㄗ':['資','字','✏️'],'ㄘ':['疵','刺蝟','🦔'],'ㄙ':['思','三','3️⃣'],
  'ㄧ':['衣','衣服','👕'],'ㄨ':['烏','烏龜','🐢'],'ㄩ':['迂','魚','🐟'],
  'ㄚ':['啊','嘴巴','👄'],'ㄛ':['喔','公雞喔喔','🐓'],'ㄜ':['鵝','白鵝','🦢'],'ㄝ':['耶','耶誕節','🎄'],
  'ㄞ':['哀','愛心','❤️'],'ㄟ':['欸','杯子','🥤'],'ㄠ':['凹','貓','🐱'],'ㄡ':['歐','狗','🐶'],
  'ㄢ':['安','飯','🍚'],'ㄣ':['恩','門','🚪'],'ㄤ':['昂','糖','🍬'],'ㄥ':['鞥','風','🌬️'],'ㄦ':['兒','耳朵','👂']
};
const ZY_LIST = Object.keys(ZY);
const STICKERS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐤','🦉','🐴','🦄','🐝','🐞','🦋','🐢','🐙','🦀','🐬','🐳','🦒','🐘','🦔','🦖','🐿️','🦩','🦜','🐠','🦭'];
const PER_STICKER = 5;

/* ============ 星星與貼紙 ============ */
let stars = lsGet('stars', 0) | 0;
const stickerCount = () => Math.min(STICKERS.length, Math.floor(stars / PER_STICKER));
function renderStars(){ $('#starN').textContent = stars; }
renderStars();
function addStar(){
  const before = stickerCount();
  stars++; lsSet('stars', stars); renderStars();
  const b = $('#starBtn'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  if(stickerCount() > before) setTimeout(()=>showSticker(STICKERS[stickerCount()-1]), 1100);
}
function showSticker(s){
  const pop = $('#pop');
  pop.innerHTML = '';
  const card = el('div','card', `<div class="sticker">${s}</div><b>得到新貼紙！</b><div class="sub">放進貼紙本了</div>`);
  const ok = el('button','btn green','好棒！');
  let release; popWait = new Promise(r=>release=r);
  ok.onclick = ()=>{ pop.hidden = true; popWait = null; release(); };
  card.appendChild(ok); pop.appendChild(card); pop.hidden = false;
  sayNow('你得到一張新貼紙！');
}
function cheer(t){ const b=$('#cheerTxt'); b.textContent=t||pick(['棒！','好厲害！','Yes!','讚！']); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }

/* ============ 聲音：語音合成 ============ */
try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); try{ speechSynthesis.addEventListener('voiceschanged', loadVoices) }catch(e){} }
let voicePref = Object.assign({zh:'', en:''}, lsGet('voicePref', {}));
function pickVoice(lang){
  const k = lang.startsWith('zh') ? 'zh' : 'en';
  return voicePref[k] ? (voices.find(v=>v.name===voicePref[k]) || null) : null;
}
// iOS：第一次觸碰時解鎖語音和音效
const player = new Audio(); player.preload = 'auto';
let unlocked = false;
function unlockAudio(){
  if(unlocked) return; unlocked = true;

const EN_RATE = 0.5;          // 英文唸慢一點
function speak(text, lang='en-US', rate=0.8){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res();
    try{
      const ss = speechSynthesis;
      try{ player.pause() }catch(e){}               // 錄音和語音不能同時出聲
      const busy = ss.speaking || ss.pending;
      if(busy) ss.cancel();
      try{ ss.resume() }catch(e){}
      if(!voices.length) loadVoices();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = rate; u.pitch = 1.1; u.volume = 1;
      const pv = pickVoice(lang); if(pv){ u.voice = pv; u.lang = pv.lang; }
      let done=false; const fin=()=>{ if(!done){done=true;res()} };
      u.onend=fin; u.onerror=fin; setTimeout(fin, 4000 + text.length*500);
      if(busy) setTimeout(()=>ss.speak(u), 120); else ss.speak(u);
    }catch(e){ res() }
  });
}
let sayToken = 0;
// 讓所有聲音停下來（語音合成＋錄音播放）
function hushAll(){
  try{ const ss = speechSynthesis; if(ss.speaking || ss.pending) ss.cancel(); }catch(e){}
  try{ player.pause() }catch(e){}
}
function stopTalking(){ sayToken++; hushAll(); }
let popWait = null;   // 貼紙彈窗開著時，遊戲的聲音先等一下
const isEn = t => /^[A-Za-z0-9 .,!?'-]+$/.test(t);
// say('找出','bird') → 中文的部分用中文唸、英文的部分用英文唸；新的一句會打斷舊的
// 也可以放 {zy:'ㄅ'}（唸注音）或 {blob}（播放錄音）
async function say(...parts){
  if(popWait) await popWait;
  return sayNow(...parts);
}
// 一次只會有一句：新的一句開始，舊的（不管是語音還是錄音）立刻停掉
async function sayNow(...parts){
  const my = ++sayToken;
  hushAll();
  for(const p of parts){
    if(my !== sayToken) return;
    if(typeof p==='number') await sleep(p);          // 數字＝停頓幾毫秒
    else if(p && p.blob) await playBlob(p.blob);
    else if(p && p.zy) await zyKey(p.zy);
    else if(isEn(p)) await enPart(p);
    else await speak(p,'zh-TW',0.9);
  }
}
const zh = t => say(t);
// 英文錄音的鑰匙：單一字母用大寫，其他用小寫（'en:A'、'en:apple'、'en:five'）
const enKey = w => 'en:' + (w.length===1 ? w.toUpperCase() : w.toLowerCase());
// 'bird. bird. bird.' → 每一段都有爸媽錄音就播錄音，否則交給語音一次唸完
async function enPart(p){
  const pieces = p.split(/(?<=[.!?])\s+/).map(x=>x.replace(/[.!?]+$/,'').trim()).filter(Boolean);
  // 每一段分開唸，中間停 0.5 秒（有錄音就播錄音）
  const my = sayToken;
  for(let k=0;k<pieces.length;k++){
    if(my !== sayToken) return;
    const key = enKey(pieces[k]);
    if(recs.has(key)) await playBlob(recs.get(key)); else await speak(pieces[k],'en-US',EN_RATE);
    if(k<pieces.length-1 && my===sayToken) await sleep(500);
  }
}

/* ============ 聲音：錄音與播放 ============ */
let blobUrl = null;
function playBlob(blob){
  return new Promise(res=>{
    try{
      try{ const ss = speechSynthesis; if(ss.speaking || ss.pending) ss.cancel(); }catch(e){}
      try{ player.pause() }catch(e){}
      if(blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(blob);
      player.src = blobUrl;
      let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
      player.onended = fin; player.onerror = fin; player.onpause = null;
      player.onplaying = ()=>{ player.onpause = fin; };   // 開始播之後被打斷，也算結束
      setTimeout(fin, 8000);
      const p = player.play(); if(p) p.catch(fin);
    }catch(e){ res(); }
  });
}
// 錄音失敗時，告訴爸媽真正的原因
function micErrorText(e){
  const inFrame = (()=>{ try{ return window.top !== window.self }catch(_){ return true } })();
  const name = (e && e.name) || '';
  if(inFrame) return '你是在 Claude 裡面的預覽開的，這裡不能用麥克風。請把遊戲網址貼到 Safari 開。';
  if(!window.isSecureContext) return '網址不是 https，不能用麥克風。';
  if(name==='NotAllowedError' || name==='SecurityError')
    return '麥克風被擋住了（' + name + '）。請到 iPad「設定 → App → Safari → 麥克風」改成「詢問」或「允許」；或在 Safari 網址列左邊按「ㄚA」→「網站設定」→ 麥克風改成「允許」，再重新整理。';
  if(name==='NotFoundError' || name==='OverconstrainedError') return '找不到麥克風（' + name + '）。';
  if(name==='NotReadableError' || name==='AbortError') return '麥克風正被別的 App 使用中（' + name + '），請關掉其他 App 再試。';
  return '不能錄音（' + (name || (e && e.message) || '未知原因') + '）。';
}
const canRecord = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
// 開始錄音；回傳 {stop(), done: Promise<Blob|null>}
async function startRecording(maxMs){
  // iPad：聲音模式是「只播放」時不准錄音（InvalidStateError），所以要先切到「可播放也可錄音」
  const setSession = t => { try{ if(navigator.audioSession) navigator.audioSession.type = t; }catch(e){} };
  try{ player.pause(); }catch(e){}
  setSession('play-and-record');
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  }catch(e){
    if(e && e.name==='InvalidStateError'){           // 再試一次：交給系統自動決定
      setSession('auto'); await sleep(150);
      try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(e2){ setSession('playback'); throw e2; }
    } else { setSession('playback'); throw e; }
  }
  const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>{ try{ return MediaRecorder.isTypeSupported(m) }catch(e){ return false } });
  const mr = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
  const chunks = [];
  mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(res=>{
    mr.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
      res(chunks.length ? new Blob(chunks, {type: mr.mimeType || mime || 'audio/mp4'}) : null);
    };
  });
  try{ mr.start(); }catch(e){ stream.getTracks().forEach(t=>t.stop()); setSession('playback'); throw e; }
  const timer = setTimeout(()=>{ try{ mr.state!=='inactive' && mr.stop() }catch(e){} }, maxMs);
  const t0 = Date.now();
  // 剛開始錄的 0.6 秒內不理會「停止」（避免連按錄到空白）
  return { stop(){ if(Date.now()-t0 < 600) return; clearTimeout(timer); try{ mr.state!=='inactive' && mr.stop() }catch(e){} }, done };
}
// IndexedDB：存爸媽錄的注音
const idb = (()=>{
  let dbp = null;
  const open = ()=> dbp || (dbp = new Promise((res,rej)=>{
    try{ const r = indexedDB.open('star-garden', 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('zy');
      r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
    }catch(e){ rej(e) }
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res,rej)=>{ const t = db.transaction('zy', mode); const st = t.objectStore('zy'); const q = fn(st); t.oncomplete = ()=>res(q && q.result); t.onerror = ()=>rej(t.error); }); };
  return {
    get: k => tx('readonly', s=>s.get(k)).catch(()=>null),
    put: (k,v) => tx('readwrite', s=>s.put(v,k)).catch(()=>null),
    del: k => tx('readwrite', s=>s.delete(k)).catch(()=>null),
    keys: () => tx('readonly', s=>s.getAllKeys()).catch(()=>[])
  };
})();
const recs = new Map();
// 以 {type, data:ArrayBuffer} 存（Safari 存 Blob 有時不穩）
const saveRec = async (k, blob) => { try{ await idb.put(k, {type: blob.type, data: await blob.arrayBuffer()}); }catch(e){} };
idb.keys().then(async ks=>{ for(const k of (ks||[])){ const v = await idb.get(k); if(v && v.data) recs.set(k, new Blob([v.data], {type: v.type||'audio/mp4'})); } });

  apple:'apples app happy',cat:'cats kat cut cap',dog:'dogs doc dug dock',fish:'fishes fist fit',bird:'birds bert burt bud word',
  duck:'ducks dock duke',pig:'pigs big peak',cow:'cows kao cal',horse:'horses house hose',lion:'lions line',tiger:'tigers',
  monkey:'monkeys',rabbit:'rabbits',frog:'frogs fog',bear:'bears bare bed',elephant:'elephants',banana:'bananas nana',
  grapes:'grape great grapes',orange:'oranges orang',lemon:'lemons',peach:'peaches pitch',cherry:'cherries chair',
  strawberry:'strawberries',watermelon:'watermelons',pear:'pair pears bear',egg:'eggs ag edge',cake:'cakes kate cape',
  milk:'mill meal milky',bread:'bred brad',rice:'rise rices',cookie:'cookies',pizza:'pizzas',juice:'juices',candy:'candies',
  car:'cars card call',bus:'buses boss',bike:'bikes back',train:'trains rain',boat:'boats both but',plane:'planes plan',
  truck:'trucks track',taxi:'taxis',red:'read rad',blue:'blew blu',green:'greens grin',yellow:'yello',purple:'people',
  black:'block back',white:'what wide',brown:'brain',eye:'eyes i aye hi',ear:'ears year here',nose:'knows no',mouth:'mouse mouse',
  hand:'hands and',foot:'feet food put',sun:'son some sum',moon:'moon mean',star:'stars start',tree:'trees three free',
  flower:'flowers flour',rain:'rainy ring'

const skel = w => w.toLowerCase().replace(/ph/g,'f').replace(/th/g,'s').replace(/ck|c|q/g,'k').replace(/v/g,'b').replace(/z/g,'s')
                   .replace(/r/g,'l').replace(/(.)\1+/g,'$1').replace(/(?!^)[aeiouy]/g,'');
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
function enWordOk(word, target){
  if(!word) return false;
  if(word===target || word.replace(/e?s$/,'')===target) return true;
  if((EN_OK[target]||'').split(' ').includes(word)) return true;
  const tol = Math.max(1, Math.floor(target.length/4));   // 4 個字母以下只能差 1 個
  const d = lev(word,target);
  if(word[0]===target[0] && d <= tol) return true;
  if(target.length>2 && skel(word)===skel(target) && d <= tol+1) return true;
  return false;
}
// 小朋友唸的對不對（texts：辨識給的幾個可能答案）
function speechOk(it, texts){
  const raw = texts.map(t=>String(t||'').trim()).filter(Boolean);
  if(it.t==='zy'){
    const c = it.c, word = ZY[c][1], homo = ZY_HOMO[c] + ZY[c][0];
    return raw.some(t => t.includes(c) || t.includes(word) || [...homo].some(h=>t.includes(h)));
  }
  const target = it.en.toLowerCase(), tJoin = target.replace(/\s/g,'');
  return raw.some(t=>{
    const s = t.toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
    if(!s) return false;
    if(s.replace(/\s/g,'').includes(tJoin)) return true;
    if(target.includes(' ')) return lev(s.replace(/\s/g,''), tJoin) <= 2;
    return s.split(' ').some(x=>enWordOk(x, target));
  });
}

  async function success(){

  };

    while(d>=step){ px+= (x1-px)*step/d; py+=(y1-py)*step/d; out.push([px,py]); d=Math.hypot(x1-px,y1-py); }
  }
  const last = pts[pts.length-1], tail = out[out.length-1];
  if(Math.hypot(last[0]-tail[0], last[1]-tail[1]) > 0.5) out.push(last);
  return out;
}

function traceGame(){ go(()=>{
  setTitle('描一描');
  const ITEMS = shuffle([...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', ...'123456789', ...ZY_LIST]);
  let idx = 0;
  const w = el('div','wrap'); stage.appendChild(w);
  const top = el('div','prompt'); const steps = el('div','steps'); const box = el('div','trace-box');
  const status = el('div','status'); const row = el('div','row');
  w.append(top, steps, box, status, row);
  const guide = document.createElement('canvas'), draw = document.createElement('canvas');
  box.append(guide, draw);
  const sayBtn = el('button','say','🔊'); sayBtn.setAttribute('aria-label','再聽一次');
  const nameEl = el('span','en'); top.append(sayBtn, nameEl);
  const prevB = el('button','btn plain','◀'), demoB = el('button','btn plain','👀 看筆順'), clearB = el('button','btn red','重來'), nextB = el('button','btn plain','▶');
  prevB.setAttribute('aria-label','上一個'); nextB.setAttribute('aria-label','下一個');
  row.append(prevB, demoB, clearB, nextB);

  let S=300, dpr=1, gctx, dctx, strokes=[], cur=0, prog=0, demoing=false, demoSeq=0, accepted=[], done=false, path=[], drawing=false, started=false;
  const ch = ()=>ITEMS[idx];
  const isZy = c => !!ZY[c];
  const sayIt = ()=>{ const c=ch(); if(isZy(c)) return zySay(c); if(/\d/.test(c)) return say(EN_NUM[+c]); return say(c+'.', HINT[c]); };
  sayBtn.onclick = sayIt;
  const U = ()=>S*dpr/100;              // 1 單位 = 幾個像素
  // 容許誤差（字格 100 單位）：起點、沿線前進、偏離線、終點
  const R_START = 10, R_FOLLOW = 10, LOOK = 20, R_DEV = 11, R_END = 12, MAX_OFF = 0.1;

  function size(){
    const avail = stage.clientHeight - top.offsetHeight - steps.offsetHeight - status.offsetHeight - row.offsetHeight - 90;
    S = Math.max(220, Math.min(stage.clientWidth - 32, avail, 560));
    box.style.width = box.style.height = S+'px';
    dpr = window.devicePixelRatio||1;
    [guide,draw].forEach(c=>{ c.width=c.height=Math.round(S*dpr) });
    gctx=guide.getContext('2d'); dctx=draw.getContext('2d');
  }
  function strokeShape(ctx, s, color, width){
    const u = U();
    if(s.o){ ctx.save(); ctx.scale(u,u); ctx.fillStyle = color; ctx.fill(new Path2D(s.o)); ctx.restore(); }
    else { ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=(width||12)*u; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); s.t.forEach(([x,y],k)=> k? ctx.lineTo(x*u,y*u) : ctx.moveTo(x*u,y*u)); ctx.stroke(); ctx.restore(); }
  }
  // 畫到第 upto 個取樣點（示範動畫用）
  function partialStroke(ctx, s, upto, color){
    const u = U(), pts = s.r.slice(0, Math.max(1, upto+1));
    ctx.save();
    if(s.o){ ctx.beginPath(); ctx.scale(u,u); ctx.clip(new Path2D(s.o)); ctx.setTransform(1,0,0,1,0,0); }
    ctx.strokeStyle=color; ctx.lineWidth=(s.o?20:12)*u; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); pts.forEach(([x,y],k)=> k? ctx.lineTo(x*u,y*u) : ctx.moveTo(x*u,y*u)); ctx.stroke(); ctx.restore();
  }
  const INK='#34B977', GUIDE='#DCE8F5', NOW='#FFC23A', HAND='rgba(255,106,77,.9)';
  function renderGuide(){
    const P = guide.width; gctx.clearRect(0,0,P,P);
    // 田字格的中線
    gctx.save(); gctx.strokeStyle='#EEF3FA'; gctx.lineWidth=2*dpr; gctx.setLineDash([8*dpr,8*dpr]);
    gctx.beginPath(); gctx.moveTo(P/2,0); gctx.lineTo(P/2,P); gctx.moveTo(0,P/2); gctx.lineTo(P,P/2); gctx.stroke(); gctx.restore();
    strokes.forEach((s,k)=> strokeShape(gctx, s, k===cur && !demoing ? '#CFE0F2' : GUIDE));
    steps.innerHTML = strokes.map((_,k)=>`<i class="${k<cur?'on':k===cur?'cur':''}"></i>`).join('');
  }
  function drawStartMark(ctx, s, n){
    const u = U(), [x,y] = s.r[0], [x2,y2] = s.r[Math.min(4, s.r.length-1)];
    // 方向箭頭
    const ang = Math.atan2(y2-y, x2-x);
    ctx.save(); ctx.translate(x*u, y*u); ctx.rotate(ang);
    ctx.fillStyle = NOW; ctx.beginPath(); ctx.moveTo(14*u,0); ctx.lineTo(8*u,-4*u); ctx.lineTo(8*u,4*u); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x*u, y*u, 5.5*u, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `700 ${7*u}px Fredoka, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(n), x*u, y*u+0.3*u); ctx.restore();
  }
  function setup(){
    done=false; cur=0; prog=0; path=[]; started=false; accepted=[];
    const c0 = ch();
    strokes = GLYPHS[c0].map(s=>({...s, r: resample(s.t, 2)}));
    nameEl.innerHTML = isZy(c0) ? `<span class="zyhint">${c0}　${ZY[c0][2]} ${escH(ZY[c0][1])}</span>` : (/\d/.test(c0) ? c0 : `${c0}　<span class="zyhint" style="font-size:.7em">${escH(HINT[c0])}</span>`);
    renderGuide(); redrawInk();
    status.textContent = `從綠色的 1 開始，照箭頭的方向描（共 ${strokes.length} 筆）`;
  }
  async function demo(){
    const my = ++demoSeq; demoing = true; dctx.clearRect(0,0,draw.width,draw.height);
    const keepCur = cur; cur = 0; dctx.clearRect(0,0,draw.width,draw.height); renderGuide();
    status.textContent = '看清楚筆順喔';
    for(let k=0;k<strokes.length;k++){
      const s = strokes[k], n = s.r.length, dur = Math.min(1100, 250 + n*12), t0 = performance.now();
      await new Promise(res=>{
        const f = now=>{
          if(my!==demoSeq) return res();
          const p = Math.min(1,(now-t0)/dur);
          partialStroke(dctx, s, Math.round(p*(n-1)), INK);
          p<1 ? requestAnimationFrame(f) : res();
        };
        requestAnimationFrame(f);
      });
      if(my!==demoSeq) return;
      await sleep(200);
    }
    await sleep(500);
    if(my!==demoSeq) return;
    demoing = false; cur = keepCur; redrawInk(); renderGuide();
    status.textContent = `換你了！從綠色的 ${cur+1} 開始描`;
  }
  const pos = e=>{ const r=draw.getBoundingClientRect(); return [(e.clientX-r.left)*100/r.width,(e.clientY-r.top)*100/r.height] };
  function inkLine(a,b){ const u=U(); dctx.strokeStyle=HAND; dctx.lineWidth=7*u; dctx.lineCap='round'; dctx.lineJoin='round'; dctx.beginPath(); dctx.moveTo(a[0]*u,a[1]*u); dctx.lineTo(b[0]*u,b[1]*u); dctx.stroke(); }
  function follow(p){
    const r = strokes[cur].r;
    if(!started){ if(Math.hypot(p[0]-r[0][0], p[1]-r[0][1]) <= R_START){ started=true; prog=0; } else return; }
    // 只能往前：在目前進度往後 LOOK 個點之內，找最遠且夠近的點
    const end = Math.min(r.length-1, prog + LOOK);
    for(let j=end;j>prog;j--){ if(Math.hypot(p[0]-r[j][0], p[1]-r[j][1]) <= R_FOLLOW){ prog=j; break; } }
  }
  // 把已經寫好的筆畫（小朋友自己的筆跡）重畫出來
  function redrawInk(){
    dctx.clearRect(0,0,draw.width,draw.height);
    for(const pts of accepted){ inkPath(pts); }
    // 下一筆的起點和方向畫在筆跡上面，才不會被蓋住
    if(!demoing && !done && cur < strokes.length) drawStartMark(dctx, strokes[cur], cur+1);
  }
  function inkPath(pts){
    if(!pts.length) return;
    const u=U(); dctx.strokeStyle=HAND; dctx.lineWidth=7*u; dctx.lineCap='round'; dctx.lineJoin='round';
    dctx.beginPath(); pts.forEach(([x,y],k)=> k? dctx.lineTo(x*u,y*u) : dctx.moveTo(x*u,y*u));
    if(pts.length===1) dctx.lineTo(pts[0][0]*u+0.01, pts[0][1]*u);
    dctx.stroke();
  }
  const dist = (a,b)=>Math.hypot(a[0]-b[0], a[1]-b[1]);
  const lenOf = pts=>{ let L=0; for(let k=1;k<pts.length;k++) L+=dist(pts[k-1],pts[k]); return L; };
  // 這一筆寫得對不對：起點、方向、有沒有寫到最後、有沒有跑出線外、有沒有亂塗
  function judgeStroke(pts){
    const r = strokes[cur].r, last = r[r.length-1];
    if(!started) return 'start';
    if(prog < r.length-1-2 || dist(pts[pts.length-1], last) > R_END) return 'short';
    const off = pts.filter(q=>{ let m=1e9; for(const t of r){ const d=dist(q,t); if(d<m) m=d; if(m<=R_DEV) break; } return m>R_DEV; }).length;
    if(off/pts.length > MAX_OFF) return 'off';
    if(lenOf(pts) > lenOf(r)*1.8 + 12) return 'scribble';
    return 'ok';
  }
  function endStroke(){
    const verdict = judgeStroke(path);
    if(verdict==='ok'){
      accepted.push(path.slice());
      cur++; prog=0; started=false;
      redrawInk(); renderGuide();
      if(cur >= strokes.length) return finish();
      status.textContent = `很好！接著寫第 ${cur+1} 筆`;
    } else {
      started=false; prog=0;
      redrawInk(); renderGuide();      // 擦掉這次沒寫好的那一筆
      status.textContent = {
        start: `從綠色的 ${cur+1} 開始，照箭頭方向寫`,
        short: '要寫到這一筆的最後喔，再試一次',
        off: '跑出線外了，沿著灰色的線寫',
        scribble: '不要來回塗喔，一筆寫過去'
      }[verdict];
    }
  }
  async function finish(){
    if(done) return; done=true;
    addStar(); cheer();
    status.textContent = '描好了！';
    const c = ch();
    await capped(isZy(c) ? say('好棒！', {zy:c}) : say('好棒！', /\d/.test(c)?EN_NUM[+c]:c+'.'), 7000);
    setTimeout(()=>{ if(done){ idx=(idx+1)%ITEMS.length; setup(); startItem(); } }, 600);
  }
  draw.addEventListener('pointerdown', e=>{
    e.preventDefault(); if(demoing || done) return;
    drawing=true; path=[pos(e)]; try{draw.setPointerCapture(e.pointerId)}catch(_){}
    follow(path[0]); inkLine(path[0],path[0]);
  });
  draw.addEventListener('pointermove', e=>{
    if(!drawing) return; const p=pos(e); inkLine(path[path.length-1], p); path.push(p); follow(p);
  });
  const up = ()=>{ if(drawing){ drawing=false; endStroke(); } };
  draw.addEventListener('pointerup', up); draw.addEventListener('pointercancel', up);
  async function startItem(){ await sayIt(); if(!done && cur===0) demo(); }
  const stopDemo = ()=>{ demoSeq++; demoing=false; };
  clearB.onclick = ()=>{ stopDemo(); setup(); };
  demoB.onclick = ()=>{ demo(); };
  prevB.onclick = ()=>{ stopDemo(); idx=(idx-1+ITEMS.length)%ITEMS.length; setup(); startItem(); };
  nextB.onclick = ()=>{ stopDemo(); idx=(idx+1)%ITEMS.length; setup(); startItem(); };
  const onResize = ()=>{ size(); renderGuide(); redrawInk(); };
  window.addEventListener('resize', onResize);
  cleanup = ()=>{ stopDemo(); window.removeEventListener('resize', onResize); };
  requestAnimationFrame(()=>{ size(); setup(); setTimeout(startItem, 300); });
})}

function mathGame(){ go(()=>{

let recBusy = null, recStarting = false;
// 錄一段，存起來，播放一次。onState(text) 回報狀態。
async function recordKey(key, label, onState){
  if(recStarting) return;

  recStarting = true; onState('準備中…', 'starting');
  try{ recBusy = {key, ctl: await startRecording(3000)}; }
  catch(e){ recStarting = false; onState(micErrorText(e)); return; }
  recStarting = false;
  onState(`錄音中：請唸「${label}」`, 'rec');
  const blob = await recBusy.ctl.done; recBusy = null;
  if(!blob){ onState('沒有錄到聲音', 'idle'); return; }
  recs.set(key, blob); saveRec(key, blob);
  onState(`「${label}」錄好了`, 'saved');
  await playBlob(blob);
}

  tbtn.onclick = ()=>{
    const lines=[]; const show=s=>{ lines.push(s); tlog.textContent=lines.join('｜'); };
    try{ const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC(); const o=ac.createOscillator(); const g=ac.createGain(); o.frequency.value=660; g.gain.value=.2; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+.25); show('嗶聲：已播放'); }catch(e){ show('嗶聲：失敗'); }
    if(!('speechSynthesis' in window)){ show('語音：不支援'); return; }
    let vs=[]; try{ vs=speechSynthesis.getVoices() }catch(e){}
    show(`語音數 ${vs.length}`);
    speak('Hello! 你好！','zh-TW',0.9).then(()=>show('語音：唸完了'));
  };
  s1.append(tbtn, tlog);
  const mkSel = (k, label, test, sample) => {
    const wrap = el('label','vrow'); wrap.htmlFor = 'voice-'+k;
    wrap.appendChild(el('span','', label));
    const sel = document.createElement('select'); sel.id = 'voice-'+k;
    const fill = ()=>{ const cur = voicePref[k]||''; sel.innerHTML=''; sel.appendChild(new Option('系統預設','')); voices.filter(v=>test.test(v.lang)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(v=>sel.appendChild(new Option(`${v.name}（${v.lang}）`, v.name))); sel.value=cur; };
    fill();
    try{ speechSynthesis.addEventListener('voiceschanged', ()=>{ loadVoices(); fill(); }) }catch(e){}
    sel.addEventListener('focus', ()=>{ loadVoices(); fill(); });
    sel.onchange = ()=>{ voicePref[k]=sel.value; lsSet('voicePref', voicePref); speak(sample, k==='zh'?'zh-TW':'en-US', k==='zh'?0.9:EN_RATE); };
    wrap.appendChild(sel); return wrap;
  };
  s1.append(mkSel('zh','中文聲音',/^zh/i,'你好，我們來玩遊戲吧！'), mkSel('en','英文聲音',/^en/i,'Find the bird.'));
  w.appendChild(s1);

  // 注音怎麼唸
  const s2 = el('div','sec','<h2>注音怎麼唸</h2><p>iPad 的語音沒有專門唸注音的功能。可以選比較好聽的方式；如果下面有爸媽錄音，一律用錄音。</p>');
  [['homo','用同音字唸（ㄅ 唸成「玻」）'],['symbol','讓語音直接唸符號（有些語音唸得對）']].forEach(([v,label])=>{
    const lab = el('label','opt'); const r = document.createElement('input'); r.type='radio'; r.name='zymode'; r.id='zymode-'+v; r.value=v; r.checked = zyMode===v;
    r.onchange = ()=>{ zyMode=v; lsSet('zyMode', v); };
    const t = el('button','btn plain small','▶ 試聽'); t.onclick = (e)=>{ e.preventDefault(); const old=zyMode; zyMode=v; say(`${zyText('ㄅ')}，${zyText('ㄆ')}，${zyText('ㄇ')}，${zyText('ㄈ')}`).then(()=>{ zyMode=lsGet('zyMode','homo'); }); };
    lab.append(r, el('span','',label), t); s2.appendChild(lab);
  });
  w.appendChild(s2);

  // 爸媽錄音（注音、英文）
  const s3 = el('div','sec','<h2>爸媽錄音</h2><p>錄好的字，遊戲裡都會改用你們的聲音；沒錄的還是用 iPad 的語音。錄音只存在這台裝置的瀏覽器裡。最方便的是按「一個一個錄」，照順序錄下去。</p>');
  const total = REC_GROUPS.reduce((a,g)=>a+g.items.length,0);
  const done = REC_GROUPS.reduce((a,g)=>a+g.items.filter(it=>recs.has(it.key)).length,0);
  s3.appendChild(el('div','tlog',`已錄 ${done} / ${total} 個`));
  const recmsg = el('div','tlog'); recmsg.id = 'recmsg'; s3.appendChild(recmsg);
  REC_GROUPS.forEach(g=>{
    const d = document.createElement('details'); d.className='recgrp';
    const n = g.items.filter(it=>recs.has(it.key)).length;
    d.innerHTML = `<summary><b>${escH(g.name)}</b><span>${n} / ${g.items.length}</span></summary>`;
    const wiz = el('button','btn small green','● 一個一個錄');
    wiz.onclick = ()=>recordWizard(g);
    const grid = el('div','recgrid');
    d.addEventListener('toggle', ()=>{ if(d.open && !grid.childElementCount) g.items.forEach(it=>grid.appendChild(recCell(it))); });
    d.append(wiz, grid); s3.appendChild(d);
  });
  w.appendChild(s3);

  // 進度
  const s4 = el('div','sec', `<h2>進度</h2><p>星星 ${stars} 顆，貼紙 ${stickerCount()} 張。</p>`);
  const reset = el('button','btn plain small','把星星和貼紙歸零');
  let armed = false;
  reset.onclick = ()=>{
    if(!armed){ armed=true; reset.textContent='確定要歸零嗎？再按一次'; setTimeout(()=>{ armed=false; reset.textContent='把星星和貼紙歸零'; }, 4000); return; }
    stars=0; lsSet('stars',0); renderStars(); s4.querySelector('p').textContent='星星 0 顆，貼紙 0 張。'; reset.textContent='已歸零'; armed=false;
  };
  s4.appendChild(reset);
  w.appendChild(s4);

  w.appendChild(el('p','credit','注音筆順資料：教育部「常用國字標準字體筆順學習網」，經 <a href="https://github.com/g0v/zh-stroke-data" target="_blank" rel="noopener">g0v zh-stroke-data</a> 整理。英文字母與數字筆順為常見教學寫法。'));
})}

home();
</script>

</body>
</html>
